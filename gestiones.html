<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestiones y Trámites - Estación Zúñiga</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body {
            background: #091016;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .caja-gestiones {
            max-width: 480px;
            width: 100%;
            border: 2px solid rgba(129, 236, 236, 0.3);
            border-radius: 24px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
            text-align: center;
        }
        .lista-tramites {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 20px 0;
        }
        .lista-tramites a {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            text-decoration: none;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }
        .lista-tramites a:hover {
            background: rgba(129, 236, 236, 0.12);
            border-color: rgba(129, 236, 236, 0.4);
            color: white;
            padding-left: 24px;
        }
        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .btn-volver:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div class="caja-gestiones">
        <h2 style="margin-top:0; font-size: 1.3rem; letter-spacing: 1px; color: #81ecec; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <span class="material-symbols-outlined" style="font-size: 28px;">gavel</span> CENTRAL DE GESTIONES
        </h2>
        <div style="font-size: 0.75rem; color: #a0a0a0; font-weight: bold; letter-spacing: 0.5px;">ACCESO DIRECTO A PLATAFORMAS INSTITUCIONALES</div>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.15); margin: 15px 0;">

        <div class="lista-tramites">
            <a href="https://www.pjn.gov.ar/" target="_blank">Poder Judicial de la Nación <span>⚖️</span></a>
            <a href="https://www.atm.mendoza.gov.ar/atm/" target="_blank">ATM Mendoza (Rentas) <span>🏢</span></a>
            <a href="https://www.anses.gob.ar/" target="_blank">ANSES <span>💼</span></a>
            <a href="https://www.afip.gob.ar/" target="_blank">AFIP <span>📊</span></a>
            <a href="https://www.dnrpa.gov.ar/portal_dnrpa/" target="_blank">DNRPA Registro Automotor <span>🚗</span></a>
            <a href="https://www.mendoza.edu.ar/" target="_blank">DGE Mendoza (Educación) <span>🎓</span></a>
            <a href="https://osepmendoza.com.ar/web/" target="_blank">OSEP Obra Social <span>🏥</span></a>
            <a href="https://atencionciudadana.mendoza.gob.ar/pagina-de-todos-los-tramites//" target="_blank">Atención Ciudadana Trámites <span>📋</span></a>
        </div>

        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">

        <a href="index.html" class="btn-volver">
            <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span> Volver a la Estación
        </a>
    </div>

</body>
</html>
