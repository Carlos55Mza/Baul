<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Mendoza - Estación Zúñiga</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        body { background: #0f1216; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; }
        .caja-transporte { max-width: 700px; width: 100%; border: 2px solid rgba(230, 126, 34, 0.4); border-radius: 24px; padding: 20px; background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(12px); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6); box-sizing: border-box; text-align: center; }
        iframe { width: 100%; height: 500px; border: none; border-radius: 14px; background: #fff; margin-top: 15px; }
        .btn-volver { display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; text-decoration: none; padding: 10px 18px; border-radius: 10px; font-weight: bold; font-size: 0.85rem; transition: background 0.2s; }
        .btn-volver:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div class="caja-transporte">
        <h2 style="margin-top:0; font-size: 1.3rem; letter-spacing: 1px; color: #e67e22; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <span class="material-symbols-outlined" style="font-size: 28px;">directions_bus</span> HORARIOS TERMINAL MENDOZA
        </h2>
        <div style="font-size: 0.75rem; color: #a0a0a0; font-weight: bold; letter-spacing: 0.5px;">COLECTIVOS DE LARGA, MEDIA DISTANCIA Y CONEXIÓN RETIRO</div>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.15); margin: 15px 0;">

        <iframe src="https://www.terminalmendoza.com.ar/" title="Terminal de Omnibus Mendoza"></iframe>

        <a href="index.html" class="btn-volver">
            <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span> Volver a la Estación
        </a>
    </div>
</body>
</html>
