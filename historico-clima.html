<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Récords Históricos - Estación Zúñiga</title>
    <style>
        html, body {
            background-color: #13191c;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        .contenedor-historico {
            background: #1e272e;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #2f3640;
            width: 95%;
            max-width: 480px;
            box-sizing: border-box;
        }
        .encabezado {
            text-align: center;
            margin-bottom: 12px;
        }
        h2 {
            color: #74b9ff;
            margin: 0 0 2px 0;
            font-size: 1.1rem;
        }
        .subtitulo {
            color: #a5b1c2;
            font-size: 0.75rem;
            margin: 0;
        }
        /* LISTA HORIZONTAL COMPACTA (EVITA QUE SE CORTE) */
        .vitrina-records {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .fila-record {
            background: #13191c;
            border: 1px solid #485460;
            border-radius: 6px;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color 0.2s;
        }
        .fila-record:hover {
            border-color: #74b9ff;
        }
        .bloque-izq {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .icono-record {
            font-size: 1.2rem;
            width: 20px;
            text-align: center;
        }
        .titulo-record {
            font-size: 0.75rem;
            color: #a5b1c2;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .bloque-der {
            text-align: right;
        }
        .valor-record {
            font-size: 1rem;
            font-weight: 800;
            color: #ffdd59;
            margin: 0;
        }
        .fecha-record {
            font-size: 0.65rem;
            color: #74b9ff;
            display: block;
            margin-top: 1px;
        }
        .detalle-racha {
            font-size: 0.65rem;
            color: #a5b1c2;
            display: block;
        }
    </style>
</head>
<body>

    <div class="contenedor-historico">
        <div class="encabezado">
            <h2>📊 Extremos Históricos Registrados</h2>
            <p class="subtitulo">Los récords imbatibles medidos en nuestra zona</p>
        </div>

        <div class="vitrina-records">
            
            <!-- TEMPERATURA MÁXIMA -->
            <div class="fila-record">
                <div class="bloque-izq">
                    <span class="icono-record">☀️</span>
                    <span class="titulo-record">Máxima Absoluta</span>
                </div>
                <div class="bloque-der">
                    <p class="valor-record" id="temp-max">--.-°C</p>
                    <span class="fecha-record" id="fecha-max">--/--/----</span>
                </div>
            </div>

            <!-- TEMPERATURA MÍNIMA -->
            <div class="fila-record">
                <div class="bloque-izq">
                    <span class="icono-record">❄️</span>
                    <span class="titulo-record">Mínima Absoluta</span>
                </div>
                <div class="bloque-der">
                    <p class="valor-record" id="temp-min">--.-°C</p>
                    <span class="fecha-record" id="fecha-min">--/--/----</span>
                </div>
            </div>

            <!-- RÁFAGA MÁXIMA -->
            <div class="fila-record">
                <div class="bloque-izq">
                    <span class="icono-record">🍃</span>
                    <span class="titulo-record">Vuela Vecino</span>
                </div>
                <div class="bloque-der">
                    <p class="valor-record" id="viento-max">--- km/h</p>
                    <span class="fecha-record" id="fecha-viento">--/--/----</span>
                </div>
            </div>

            <!-- AMPLITUD TÉRMICA -->
            <div class="fila-record">
                <div class="bloque-izq">
                    <span class="icono-record">📈</span>
                    <span class="titulo-record">Mayor Amplitud</span>
                </div>
                <div class="bloque-der">
                    <p class="valor-record" id="amplitud-max">--.-°C</p>
                    <span class="fecha-record" id="fecha-amplitud">--/--/----</span>
                </div>
            </div>

            <!-- RACHA DE DÍAS SECOS -->
            <div class="fila-record">
                <div class="bloque-izq">
                    <span class="icono-record">🌵</span>
                    <div>
                        <span class="titulo-record">Racha Seca Secuencial</span>
                        <span class="detalle-racha" id="racha-detalle">--</span>
                    </div>
                </div>
                <div class="bloque-der">
                    <p class="valor-record" id="racha-seca" style="font-size: 1.1rem;">--</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 📊 TUS DATA REALES CARGADAS
        const datosRecords = {
            temp_max: { valor: 43.3, fecha: "24/12/2012" },
            temp_min: { valor: -9.6, fecha: "06/07/2007" },
            viento_max: { valor: 100, fecha: "21/07/2023" },
            amplitud_max: { valor: 27.8, fecha: "10/02/2025" },
            racha_seca: { valor: 120, detalle: "Primer semestre del 2022" }
        };

        function cargarVitrina() {
            document.getElementById('temp-max').innerText = `${datosRecords.temp_max.valor}°C`;
            document.getElementById('fecha-max').innerText = datosRecords.temp_max.fecha;

            document.getElementById('temp-min').innerText = `${datosRecords.temp_min.valor}°C`;
            document.getElementById('fecha-min').innerText = datosRecords.temp_min.fecha;

            document.getElementById('viento-max').innerText = `${datosRecords.viento_max.valor} km/h`;
            document.getElementById('fecha-viento').innerText = datosRecords.viento_max.fecha;

            document.getElementById('amplitud-max').innerText = `${datosRecords.amplitud_max.valor}°C`;
            document.getElementById('fecha-amplitud').innerText = datosRecords.amplitud_max.fecha;

            document.getElementById('racha-seca').innerText = `${datosRecords.racha_seca.valor} días`;
            document.getElementById('racha-detalle').innerText = datosRecords.racha_seca.detalle;
        }

        window.onload = cargarVitrina;
    </script>
</body>
</html>
