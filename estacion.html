<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estación Zúñiga 🛰️ Nueva Era</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-light: #ffffff;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #112233 100%);
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-light);
            min-height: 100vh;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.15);
            z-index: 1;
            pointer-events: none;
        }

        .wrapper {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 0;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .card-transparente {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px;
            max-width: 340px;
            margin: 20px auto;
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        .city-selector select {
            background: rgba(255, 255, 255, 0.95);
            color: #222;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            padding: 8px 12px;
            font-weight: bold;
            outline: none;
            width: 85%;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            cursor: pointer;
        }

        .weather-info {
            display: flex;
            align-items: center;
            justify-content: space-around;
            margin: 20px 0;
        }

        .temp-huge {
            font-size: 3.8rem;
            font-weight: 900;
            line-height: 1;
            text-shadow: 2px 3px 6px rgba(0,0,0,0.4);
        }

        .st-box {
            font-size: 0.9rem;
            font-weight: bold;
            color: #ffbe76;
            margin-top: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .box-extendido {
            background: rgba(255, 255, 255, 0.12);
            padding: 12px;
            border-radius: 14px;
            text-align: center;
            width: 120px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="wrapper">
        <h1>ESTACIÓN ZÚÑIGA</h1>

        <div class="card-transparente">
            <div class="city-selector">
                <select id="departamentos" onchange="updateWeatherLocation(this.value)">
                    <option value="-33.08,-68.47,SAN MARTÍN">San Martín</option>
                    <option value="-32.89,-68.84,MENDOZA CAP.">Mendoza Cap.</option>
                    <option value="-32.92,-68.81,GODOY CRUZ">Godoy Cruz</option>
                    <option value="-32.90,-68.78,GUAYMALLÉN">Guaymallén</option>
                    <option value="-32.85,-68.83,LAS HERAS">Las Heras</option>
                    <option value="-33.00,-68.87,LUJÁN DE CUYO">Luján de Cuyo</option>
                    <option value="-32.98,-68.76,MAIPÚ">Maipú</option>
                    <option value="-33.15,-68.48,JUNÍN">Junín</option>
                    <option value="-33.19,-68.46,RIVADAVIA">Rivadavia</option>
                    <option value="-33.25,-68.15,SANTA ROSA">Santa Rosa</option>
                    <option value="-33.46,-67.55,LA PAZ">La Paz</option>
                    <option value="-33.58,-69.01,TUNUYÁN">Tunuyán</option>
                    <option value="-33.37,-69.14,TUPUNGATO">Tupungato</option>
                    <option value="-33.77,-69.04,SAN CARLOS">San Carlos</option>
                    <option value="-34.61,-68.33,SAN RAFAEL">San Rafael</option>
                    <option value="-34.97,-67.69,GRAL. ALVEAR">Gral. Alvear</option>
                    <option value="-35.47,-69.58,MALARGÜE">Malargüe</option>
                    <option value="-32.72,-68.59,LAVALLE">Lavalle</option>
                </select>
            </div>

            <div class="weather-info">
                <span id="weather-icon" class="material-symbols-outlined" style="font-size: 55px; color: #fbc02d; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4));">wb_sunny</span>
                <div>
                    <div class="temp-huge" id="temp-display"><span id="temp">--</span>°</div>
                    <div class="st-box">ST: <span id="st-val">--</span>°C</div>
                </div>
                <div style="text-align: right;">
                    <div id="city-display" style="font-weight: 900; font-size: 0.95rem; color: #54a0ff; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">SAN MARTÍN</div>
                    <div id="hum-display" style="font-size: 0.85rem; color: #e0e0e0; font-weight: bold; margin-top: 2px;">Hum: --%</div>
                </div>
            </div>

            <div style="display: flex; justify-content: center; gap: 12px; margin-top: 20px;">
                <div class="box-extendido">
                    <div style="font-size: 0.75rem; color: #ced4da; text-transform: uppercase; font-weight: bold;">Mañana</div>
                    <div id="icono-manana" style="font-size: 1.5rem; margin: 5px 0;">☀️</div>
                    <div style="font-size: 0.9rem; font-weight: bold;">
                        <span id="max-manana" style="color: #ff7675;">--°</span> / 
                        <span id="min-manana" style="color: #74b9ff;">--°</span>
                    </div>
                </div>

                <div class="box-extendido">
                    <div style="font-size: 0.75rem; color: #ced4da; text-transform: uppercase; font-weight: bold;">Pasado</div>
                    <div id="icono-pasado" style="font-size: 1.5rem; margin: 5px 0;">🌤️</div>
                    <div style="font-size: 0.9rem; font-weight: bold;">
                        <span id="max-pasado" style="color: #ff7675;">--°</span> / 
                        <span id="min-pasado" style="color: #74b9ff;">--°</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="clima.js"></script>
</body>
</html>
